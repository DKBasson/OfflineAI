<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OfflineAI</title>
  <script src="/static/marked.min.js"></script>
  <script src="/static/dompurify.min.js"></script>
  <link rel="stylesheet" href="/static/github-dark.min.css">
  <script src="/static/highlight.min.js"></script>
  <style>
    :root {
      --bg:        #09090e;
      --glass:     rgba(255,255,255,0.055);
      --glass-md:  rgba(255,255,255,0.09);
      --glass-hi:  rgba(255,255,255,0.14);
      --border:    rgba(255,255,255,0.09);
      --border-hi: rgba(255,255,255,0.16);
      --text:      rgba(255,255,255,0.92);
      --text-2:    rgba(255,255,255,0.52);
      --text-3:    rgba(255,255,255,0.28);
      --accent:    #0A84FF;
      --accent-lo: rgba(10,132,255,0.14);
      --accent-b:  rgba(10,132,255,0.28);
      --err:       rgba(255,69,58,0.9);
      --err-text:  rgba(255,160,150,0.95);
      --blur:      blur(32px) saturate(180%);
      --r:         16px;
      --r-sm:      12px;
      --shadow:    0 4px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
      --shadow-sm: 0 2px 12px rgba(0,0,0,0.3);
    }

    html { overflow: hidden; max-width: 100%; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 90% 55% at 15%   5%, rgba(88,86,214,.13)  0%, transparent 65%),
        radial-gradient(ellipse 65% 50% at 85%  95%, rgba(10,132,255,.09) 0%, transparent 60%);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Sidebar overlay ────────────────────────────────── */
    #sidebar-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 40;
    }
    #sidebar-overlay.open { display: block; }

    /* ── History Sidebar ────────────────────────────────── */
    #sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 292px;
      background: rgba(12,12,20,0.88);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-right: 1px solid var(--border-hi);
      z-index: 50;
      display: flex; flex-direction: column;
      transform: translateX(-100%);
      transition: transform .28s cubic-bezier(.4,0,.2,1);
      box-shadow: var(--shadow);
    }
    #sidebar.open { transform: translateX(0); }

    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 14px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: 13px; font-weight: 600; color: var(--text);
      letter-spacing: -.1px;
    }
    .sidebar-close {
      width: 26px; height: 26px;
      background: var(--glass-md); border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--text-2); font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s, color .15s;
    }
    .sidebar-close:hover { background: var(--glass-hi); color: var(--text); }

    #history-list {
      flex: 1; overflow-y: auto; padding: 6px 8px;
    }
    #history-list::-webkit-scrollbar { width: 3px; }
    #history-list::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

    .history-item {
      padding: 10px 12px;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background .15s;
      margin-bottom: 2px;
      border: 1px solid transparent;
    }
    .history-item:hover { background: var(--glass-md); border-color: var(--border); }
    .history-item.active { background: var(--accent-lo); border-color: var(--accent-b); }

    .history-title {
      font-size: 13px; font-weight: 500; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .history-meta {
      font-size: 11px; color: var(--text-3);
      display: flex; gap: 8px;
    }

    .sidebar-new-btn {
      margin: 10px;
      padding: 10px;
      background: var(--glass-md);
      border: 1px solid var(--border-hi);
      border-radius: var(--r-sm);
      color: var(--accent);
      font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: center;
      transition: background .15s, border-color .15s;
      flex-shrink: 0;
    }
    .sidebar-new-btn:hover { background: var(--accent-lo); border-color: var(--accent-b); }

    .history-empty {
      text-align: center; color: var(--text-3);
      font-size: 13px; padding: 32px 16px;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      background: var(--glass);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative; z-index: 10;
    }

    .hdr-icon-btn {
      width: 32px; height: 32px; border-radius: 10px;
      background: var(--glass-md); border: 1px solid var(--border);
      color: var(--text-2); font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    .hdr-icon-btn:hover { background: var(--glass-hi); color: var(--text); }
    #clear-btn { margin-left: auto; }

    .brand {
      display: flex; align-items: center; gap: 7px;
      font-size: 14px; font-weight: 600; letter-spacing: -.3px;
      flex-shrink: 0;
    }
    .brand-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(10,132,255,.7);
    }

    /* ── Messages ───────────────────────────────────────── */
    #messages {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 28px 20px 12px;
      display: flex; flex-direction: column; gap: 18px;
    }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

    .message {
      display: flex; gap: 10px;
      max-width: 760px; width: 100%; min-width: 0;
      animation: fadeUp .2s ease;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(6px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .message.user { margin-left: auto; flex-direction: row-reverse; }

    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      flex-shrink: 0; margin-top: 2px;
    }
    .message.user .avatar {
      background: linear-gradient(135deg, #0A84FF, #0055cc);
      color: #fff;
    }
    .message.assistant .avatar {
      background: var(--glass-md);
      border: 1px solid var(--border-hi);
      color: var(--text-2);
    }

    .message-body {
      display: flex; flex-direction: column; gap: 6px;
      max-width: calc(100% - 38px); min-width: 0;
    }

    .msg-images { display: flex; flex-wrap: wrap; gap: 6px; }
    .msg-images img {
      max-height: 200px; max-width: 300px;
      border-radius: 12px; object-fit: cover;
      cursor: pointer; border: 1px solid var(--border);
      transition: opacity .2s;
    }
    .msg-images img:hover { opacity: .88; }

    .msg-text {
      border-radius: 14px;
      padding: 11px 15px;
      line-height: 1.65; font-size: 14px;
      word-break: break-word;
    }
    .message.user .msg-text {
      background: var(--accent-lo);
      border: 1px solid var(--accent-b);
      white-space: pre-wrap;
    }
    .message.assistant .msg-text {
      background: var(--glass);
      border: 1px solid var(--border);
      white-space: normal;
    }

    /* Markdown inside bubbles */
    .msg-text h1,.msg-text h2,.msg-text h3 { margin: 10px 0 4px; line-height: 1.3; }
    .msg-text h1 { font-size: 1.2em; }
    .msg-text h2 { font-size: 1.1em; }
    .msg-text h3 { font-size: 1em; }
    .msg-text p  { margin: 5px 0; }
    .msg-text p:first-child { margin-top: 0; }
    .msg-text p:last-child  { margin-bottom: 0; }
    .msg-text ul,.msg-text ol { padding-left: 20px; margin: 5px 0; }
    .msg-text li { margin: 3px 0; }
    .msg-text code {
      background: rgba(255,255,255,0.08);
      border-radius: 5px; padding: 1px 5px;
      font-size: 12.5px;
      font-family: 'SF Mono','Fira Code','Menlo',monospace;
    }
    .msg-text pre {
      background: rgba(0,0,0,0.35) !important;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px; margin: 10px 0;
      overflow-x: auto; position: relative;
    }
    .msg-text pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.6; }
    .msg-text blockquote {
      border-left: 2px solid rgba(10,132,255,.4);
      padding-left: 12px; color: var(--text-2); margin: 8px 0;
    }
    .msg-text table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
    .msg-text th,.msg-text td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
    .msg-text th { background: var(--glass-md); }
    .msg-text a { color: var(--accent); text-decoration: none; }
    .msg-text a:hover { text-decoration: underline; }
    .msg-text hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

    .copy-code-btn {
      position: absolute; top: 8px; right: 8px;
      background: var(--glass-md); border: 1px solid var(--border);
      color: var(--text-2); padding: 3px 9px; border-radius: 6px;
      font-size: 11px; cursor: pointer; font-family: inherit;
      transition: color .15s;
    }
    .copy-code-btn:hover { color: var(--text); }

    .thinking {
      display: flex; gap: 5px;
      padding: 12px 15px;
      background: var(--glass); border: 1px solid var(--border);
      border-radius: 14px; width: fit-content;
    }
    .thinking span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-3);
      animation: bounce 1.2s infinite;
    }
    .thinking span:nth-child(2) { animation-delay: .2s; }
    .thinking span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); opacity: .35; }
      40%          { transform: translateY(-6px); opacity: 1; }
    }

    .streaming::after {
      content: '▊';
      animation: blink .7s infinite;
      color: var(--accent); font-size: 12px;
    }
    @keyframes blink {
      0%,100% { opacity: .7; }
      50%      { opacity: 0; }
    }

    .msg-text.error {
      border-color: rgba(255,69,58,.35);
      background: rgba(255,69,58,.07);
      color: var(--err-text);
    }

    /* ── Welcome ────────────────────────────────────────── */
    #welcome {
      margin: auto; text-align: center;
      padding: 48px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      animation: fadeUp .35s ease;
    }
    .welcome-glyph {
      width: 56px; height: 56px; border-radius: 16px;
      background: var(--glass-md);
      border: 1px solid var(--border-hi);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; margin-bottom: 4px;
      box-shadow: var(--shadow-sm);
    }
    #welcome h2 { font-size: 22px; font-weight: 600; letter-spacing: -.4px; }
    #welcome p  { color: var(--text-2); font-size: 13px; max-width: 320px; line-height: 1.6; }

    .chips {
      display: flex; flex-wrap: wrap; gap: 7px;
      justify-content: center; margin-top: 10px; max-width: 420px;
    }
    .chip {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 7px 14px;
      font-size: 12.5px; cursor: pointer; color: var(--text-2);
      transition: color .15s, border-color .15s, background .15s;
    }
    .chip:hover { color: var(--text); border-color: var(--border-hi); background: var(--glass-md); }

    /* ── Footer / Input ─────────────────────────────────── */
    footer {
      padding: 8px 16px 14px;
      flex-shrink: 0;
    }

    #img-previews {
      display: none; gap: 8px; padding-bottom: 8px;
      overflow-x: auto; flex-wrap: nowrap;
    }
    .img-thumb { position: relative; flex-shrink: 0; }
    .img-thumb img {
      width: 56px; height: 56px;
      object-fit: cover; border-radius: 10px;
      border: 1px solid var(--border);
    }
    .img-thumb .rm-img {
      position: absolute; top: -6px; right: -6px;
      width: 17px; height: 17px; border-radius: 50%;
      background: var(--glass-hi); border: 1px solid var(--border-hi);
      color: var(--text-2); font-size: 12px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: color .15s;
    }
    .img-thumb .rm-img:hover { color: var(--text); }

    .input-wrap {
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--glass-md);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border-hi);
      border-radius: 20px; padding: 8px 8px 8px 16px;
      transition: border-color .2s;
      box-shadow: var(--shadow-sm);
    }
    .input-wrap:focus-within { border-color: rgba(10,132,255,.35); }

    #input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-size: 16px; font-family: inherit;
      resize: none; line-height: 1.55;
      min-height: 24px; max-height: 180px;
      overflow-y: auto; padding: 2px 0;
    }
    #input::placeholder { color: var(--text-3); }

    .input-btns { display: flex; gap: 5px; align-items: flex-end; flex-shrink: 0; }

    #attach-btn {
      width: 32px; height: 32px; border-radius: 10px;
      background: none; border: 1px solid var(--border);
      color: var(--text-3); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s, border-color .15s, background .15s;
    }
    #attach-btn:hover { color: var(--text-2); border-color: var(--border-hi); background: var(--glass); }

    #send-btn, #stop-btn {
      width: 32px; height: 32px; border-radius: 10px;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, opacity .15s;
    }
    #send-btn { background: var(--accent); color: #fff; box-shadow: 0 2px 10px rgba(10,132,255,.3); }
    #send-btn:hover { background: #0070e0; }
    #send-btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
    #stop-btn { display: none; background: rgba(255,69,58,.85); color: #fff; }
    #stop-btn:hover { background: var(--err); }

    .footer-hint {
      text-align: center; color: var(--text-3);
      font-size: 11px; margin-top: 8px;
    }

    /* ── Drag overlay ───────────────────────────────────── */
    #drag-overlay {
      display: none;
      position: fixed; inset: 12px;
      background: rgba(10,132,255,.05);
      border: 2px dashed rgba(10,132,255,.35);
      border-radius: 20px; z-index: 100;
      pointer-events: none;
      align-items: center; justify-content: center;
      font-size: 14px; color: var(--accent); font-weight: 600;
      gap: 10px; backdrop-filter: blur(4px);
    }
    body.drag-active #drag-overlay { display: flex; }

    /* ── Lightbox ───────────────────────────────────────── */
    #lightbox {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 200;
      align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 90vw; max-height: 90vh;
      border-radius: 12px; object-fit: contain;
      box-shadow: 0 32px 80px rgba(0,0,0,.6);
    }

    /* ── Safe-area / notch support ──────────────────────── */
    header  { padding-left:  max(14px, env(safe-area-inset-left));
               padding-right: max(14px, env(safe-area-inset-right)); }
    footer  { padding-left:  max(16px, env(safe-area-inset-left));
               padding-right: max(16px, env(safe-area-inset-right));
               padding-bottom: max(14px, env(safe-area-inset-bottom)); }
    #sidebar { padding-bottom: env(safe-area-inset-bottom); }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 600px) {
      /* Header — hide model select label, shrink gap */
      header { gap: 8px; padding-top: 9px; padding-bottom: 9px; }
      .brand { font-size: 13px; }

      /* Sidebar full-width-ish on small screens */
      #sidebar { width: min(85vw, 300px); }

      /* Messages — tighter padding, smaller bubbles */
      #messages {
        padding: 14px 10px 8px;
        gap: 14px;
      }
      .message { max-width: 100%; }
      .avatar  { width: 24px; height: 24px; font-size: 10px; }
      .message-body { max-width: calc(100% - 32px); }
      .msg-text { font-size: 13.5px; padding: 10px 13px; }
      .msg-images img { max-height: 160px; max-width: 100%; }

      /* Welcome — compact */
      #welcome { padding: 28px 16px; gap: 10px; }
      #welcome h2 { font-size: 18px; }
      #welcome p  { font-size: 12.5px; }
      .welcome-glyph { width: 46px; height: 46px; font-size: 22px; border-radius: 13px; }
      .chips { gap: 6px; margin-top: 8px; }
      .chip  { font-size: 12px; padding: 6px 12px; }

      /* Footer — remove hint text, tighter */
      footer { padding-top: 6px; }
      .footer-hint { display: none; }
      .input-wrap { border-radius: 18px; padding: 7px 7px 7px 13px; }
      #input { font-size: 16px; }

      /* Image previews tighter */
      .img-thumb img { width: 48px; height: 48px; }
    }


  </style>
</head>
<body>

  <div id="sidebar-overlay"></div>

  <div id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">History</span>
      <button class="sidebar-close" id="sidebar-close-btn">✕</button>
    </div>
    <div id="history-list"></div>
    <button class="sidebar-new-btn" id="new-chat-btn">+ New Chat</button>
  </div>

  <header>
    <button class="hdr-icon-btn" id="history-btn" title="History">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="15" y2="18"/>
      </svg>
    </button>
    <div class="brand">
      <div class="brand-dot"></div>
      OfflineAI
    </div>
    <button class="hdr-icon-btn" id="clear-btn" title="New chat">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </header>

  <main id="messages"></main>

  <footer>
    <div id="img-previews"></div>
    <div class="input-wrap">
      <textarea id="input" placeholder="Message…" rows="1"></textarea>
      <div class="input-btns">
        <button id="attach-btn" title="Attach image">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <button id="send-btn" title="Send (Enter)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
        <button id="stop-btn" title="Stop">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <rect x="4" y="4" width="16" height="16" rx="3"/>
          </svg>
        </button>
      </div>
    </div>
    <input type="file" id="file-input" accept="image/*" multiple hidden>
    <p class="footer-hint">Enter to send · Shift+Enter for newline · Paste or drag images to attach</p>
  </footer>

  <div id="drag-overlay">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
    </svg>
    Drop images to attach
  </div>

  <div id="lightbox">
    <img id="lightbox-img" src="" alt="">
  </div>

<script>
  // ── Config ────────────────────────────────────────────
  const DEFAULT_MODEL = 'gemma4:e4b';
  const MAX_HISTORY   = 60;
  const MAX_CONTEXT   = 20; // max messages sent per request (prevents context-window overflow)

  // Configure marked once at startup
  marked.use({ breaks: true, gfm: true });

  // ── State ─────────────────────────────────────────────
  let messages      = [];
  let pendingImages = [];
  let isStreaming   = false;
  let abortCtrl     = null;
  let streamEl      = null;
  let streamText    = '';
  let currentConvId = null;

  // ── DOM ───────────────────────────────────────────────
  const messagesEl   = document.getElementById('messages');
  const inputEl      = document.getElementById('input');
  const sendBtn      = document.getElementById('send-btn');
  const stopBtn      = document.getElementById('stop-btn');
  const attachBtn    = document.getElementById('attach-btn');
  const fileInput    = document.getElementById('file-input');
  const previewsEl   = document.getElementById('img-previews');
  const clearBtn     = document.getElementById('clear-btn');
  const historyBtn   = document.getElementById('history-btn');
  const sidebar      = document.getElementById('sidebar');
  const sidebarOver  = document.getElementById('sidebar-overlay');
  const sidebarClose = document.getElementById('sidebar-close-btn');
  const newChatBtn   = document.getElementById('new-chat-btn');
  const historyList  = document.getElementById('history-list');
  const lightbox     = document.getElementById('lightbox');
  const lightboxImg  = document.getElementById('lightbox-img');

  // ── Init ──────────────────────────────────────────────
  async function init() {
    showWelcome();
    setupListeners();
    inputEl.focus();
  }

  // ── Listeners ─────────────────────────────────────────
  function setupListeners() {
    sendBtn.addEventListener('click', sendMessage);
    stopBtn.addEventListener('click', () => abortCtrl?.abort());
    clearBtn.addEventListener('click', startNewChat);
    newChatBtn.addEventListener('click', () => { startNewChat(); closeSidebar(); });
    historyBtn.addEventListener('click', toggleSidebar);
    sidebarClose.addEventListener('click', closeSidebar);
    sidebarOver.addEventListener('click', closeSidebar);

    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
      const files = [...e.target.files].filter(f => f.type.startsWith('image/'));
      if (files.length) addImages(files);
      e.target.value = '';
    });

    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    inputEl.addEventListener('input', () => autoResize(inputEl));

    // Drag & drop
    let dragCount = 0;
    document.addEventListener('dragenter', e => {
      const hasImg = [...(e.dataTransfer?.items || [])].some(
        i => i.kind === 'file' && i.type.startsWith('image/')
      );
      if (hasImg) { dragCount++; document.body.classList.add('drag-active'); }
    });
    document.addEventListener('dragleave', () => {
      dragCount = Math.max(0, dragCount - 1);
      if (!dragCount) document.body.classList.remove('drag-active');
    });
    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => {
      e.preventDefault(); dragCount = 0;
      document.body.classList.remove('drag-active');
      const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
      if (files.length) addImages(files);
    });

    // Paste
    document.addEventListener('paste', e => {
      const imgs = [...e.clipboardData.items].filter(i => i.type.startsWith('image/'));
      if (imgs.length) { e.preventDefault(); addImages(imgs.map(i => i.getAsFile())); }
    });

    // Lightbox
    messagesEl.addEventListener('click', e => {
      if (e.target.matches('.msg-images img')) {
        lightboxImg.src = e.target.src;
        lightbox.classList.add('open');
      }
    });
    lightbox.addEventListener('click', () => lightbox.classList.remove('open'));

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { lightbox.classList.remove('open'); closeSidebar(); }
    });
  }

  // ── Sidebar ───────────────────────────────────────────
  function toggleSidebar() {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  }
  function openSidebar() {
    renderHistoryList();
    sidebar.classList.add('open');
    sidebarOver.classList.add('open');
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOver.classList.remove('open');
  }

  function renderHistoryList() {
    const items = getHistory();
    if (!items.length) {
      historyList.innerHTML = '<div class="history-empty">No conversations yet</div>';
      return;
    }
    historyList.innerHTML = '';
    for (const item of items) {
      const div = document.createElement('div');
      div.className = 'history-item' + (item.id === currentConvId ? ' active' : '');
      div.innerHTML = `
        <div class="history-title">${escHtml(item.title)}</div>
        <div class="history-meta">
          <span>${escHtml(formatDate(item.timestamp))}</span>
          <span>${escHtml(item.model)}</span>
        </div>`;
      div.addEventListener('click', () => loadConversation(item));
      historyList.appendChild(div);
    }
  }

  function loadConversation(item) {
    if (isStreaming) return;
    messages = item.messages;
    currentConvId = item.id;
    // Try to restore the model selector
    messagesEl.innerHTML = '';
    for (const msg of messages) {
      if (msg.role === 'user') {
        appendUserBubble(msg, []);
      } else if (msg.role === 'assistant') {
        const el = document.createElement('div');
        el.className = 'message assistant';
        el.innerHTML = `
          <div class="avatar">⚡</div>
          <div class="message-body">
            <div class="msg-text">${DOMPurify.sanitize(renderMd(msg.content))}</div>
          </div>`;
        el.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
        el.querySelectorAll('pre').forEach(addCopyBtn);
        messagesEl.appendChild(el);
      }
    }
    closeSidebar();
    scrollBottom();
  }

  // ── History persistence ───────────────────────────────
  function getHistory() {
    try { return JSON.parse(localStorage.getItem('offlineai_history') || '[]'); }
    catch { return []; }
  }

  function saveToHistory() {
    if (!messages.length) return;
    const history = getHistory();
    const isNew = !currentConvId;
    const id = currentConvId || String(Date.now());
    currentConvId = id;
    // Strip base64 images to avoid localStorage bloat
    const stripped = messages.map(({ images, ...rest }) => rest);
    const existing = history.find(h => h.id === id);
    const title = existing?.title || stripped[0]?.content?.trim().slice(0, 72) || 'Image conversation';
    const entry = { id, title, timestamp: Date.now(), model: DEFAULT_MODEL, messages: stripped };
    const idx = history.findIndex(h => h.id === id);
    if (idx >= 0) history[idx] = entry; else history.unshift(entry);
    try {
      localStorage.setItem('offlineai_history', JSON.stringify(history.slice(0, MAX_HISTORY)));
    } catch { /* storage full — skip */ }
    // Generate an AI title only once, after the first full exchange
    if (isNew && stripped.length >= 2) {
      generateTitle(stripped).then(title => {
        if (!title) return;
        const h = getHistory();
        const i = h.findIndex(x => x.id === id);
        if (i >= 0) { h[i].title = title; }
        try { localStorage.setItem('offlineai_history', JSON.stringify(h)); } catch {}
        if (sidebar.classList.contains('open')) renderHistoryList();
      });
    }
  }

  async function generateTitle(stripped) {
    const excerpt = stripped.slice(0, 2)
      .map(m => `${m.role}: ${m.content.slice(0, 400)}`).join('\n');
    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: DEFAULT_MODEL,
          messages: [{
            role: 'user',
            content: `Give this conversation a short title of 4 words or less. Reply with the title only — no punctuation, no quotes, no explanation:\n\n${excerpt}`
          }],
          stream: false
        })
      });
      const text = await resp.text();
      // stream:false returns one JSON line
      const d = JSON.parse(text.trim().split('\n')[0]);
      const title = d.message?.content?.trim().replace(/^["']+|["']+$/g, '').slice(0, 72);
      return title || null;
    } catch {
      return null;
    }
  }

  function formatDate(ts) {
    const d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString())
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  // ── Image helpers ─────────────────────────────────────
  async function addImages(files) {
    for (const file of files) {
      const dataUrl = await readDataUrl(file);
      pendingImages.push({ dataUrl, base64: dataUrl.split(',')[1] });
    }
    renderPreviews();
  }

  function readDataUrl(file) {
    return new Promise(resolve => {
      const r = new FileReader();
      r.onload = e => resolve(e.target.result);
      r.readAsDataURL(file);
    });
  }

  function renderPreviews() {
    previewsEl.innerHTML = '';
    if (!pendingImages.length) { previewsEl.style.display = 'none'; return; }
    previewsEl.style.display = 'flex';
    pendingImages.forEach((img, i) => {
      const div = document.createElement('div');
      div.className = 'img-thumb';
      const thumb = document.createElement('img');
      thumb.src = img.dataUrl; thumb.alt = 'preview';
      const rm = document.createElement('button');
      rm.className = 'rm-img'; rm.textContent = '×';
      rm.setAttribute('aria-label', 'Remove image');
      rm.addEventListener('click', () => { pendingImages.splice(i, 1); renderPreviews(); });
      div.appendChild(thumb); div.appendChild(rm);
      previewsEl.appendChild(div);
    });
  }

  // ── Send ──────────────────────────────────────────────
  async function sendMessage() {
    if (isStreaming) return;
    const text = inputEl.value.trim();
    if (!text && !pendingImages.length) return;

    const imgs    = [...pendingImages];
    const userMsg = {
      role: 'user', content: text,
      ...(imgs.length ? { images: imgs.map(i => i.base64) } : {})
    };
    messages.push(userMsg);

    inputEl.value = '';
    autoResize(inputEl);
    pendingImages = [];
    renderPreviews();

    appendUserBubble(userMsg, imgs);
    const assistantRow = appendThinking();

    isStreaming = true;
    sendBtn.style.display = 'none';
    stopBtn.style.display  = 'flex';
    streamText = '';

    const contextMsgs = messages.slice(-MAX_CONTEXT);
    const payload = {
      model: DEFAULT_MODEL,
      messages: contextMsgs.map(m => ({
        role: m.role, content: m.content,
        ...(m.images ? { images: m.images } : {})
      })),
      stream: true
    };

    try {
      abortCtrl = new AbortController();
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload),
        signal:  abortCtrl.signal
      });

      if (!resp.ok) {
        const errText = await resp.text().catch(() => resp.statusText);
        throw new Error(`Server error ${resp.status}: ${errText}`);
      }
      assistantRow.querySelector('.thinking').remove();
      streamEl = document.createElement('div');
      streamEl.className = 'msg-text streaming';
      assistantRow.querySelector('.message-body').appendChild(streamEl);

      const reader = resp.body.getReader();
      const dec    = new TextDecoder();
      let   buf    = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          try {
            const d = JSON.parse(line);
            if (d.error) {
              streamEl.textContent = `⚠️ ${d.error}`;
              streamEl.classList.add('error');
              streamText = '';
              return;
            }
            if (d.message?.content) {
              streamText += d.message.content;
              streamEl.textContent = streamText;
              scrollBottom();
            }
          } catch { /* malformed chunk */ }
        }
      }

    } catch (err) {
      if (err.name !== 'AbortError') {
        const errMsg = `⚠️ ${err.message}`;
        if (streamEl) {
          streamText = errMsg;
          streamEl.textContent = errMsg;
          streamEl.classList.add('error');
        } else {
          assistantRow.querySelector('.thinking')?.remove();
          const el = document.createElement('div');
          el.className = 'msg-text error';
          el.textContent = errMsg;
          assistantRow.querySelector('.message-body').appendChild(el);
        }
        streamText = '';
      }
    } finally {
      isStreaming = false;
      sendBtn.style.display = 'flex';
      stopBtn.style.display  = 'none';

      if (streamEl && streamText && !streamEl.classList.contains('error')) {
        streamEl.classList.remove('streaming');
        streamEl.innerHTML = DOMPurify.sanitize(renderMd(streamText));
        streamEl.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
        streamEl.querySelectorAll('pre').forEach(addCopyBtn);
        messages.push({ role: 'assistant', content: streamText });
        saveToHistory();
      } else if (streamText && !streamEl?.classList.contains('error')) {
        messages.push({ role: 'assistant', content: streamText });
        saveToHistory();
      }

      streamEl   = null;
      streamText = '';
      scrollBottom();
      inputEl.focus();
    }
  }

  // ── DOM helpers ───────────────────────────────────────
  function appendUserBubble(msg, imgs) {
    document.getElementById('welcome')?.remove();
    const el = document.createElement('div');
    el.className = 'message user';
    const imagesHtml = imgs.length
      ? `<div class="msg-images">${imgs.map(i => `<img src="${escHtml(i.dataUrl)}" alt="attached image">`).join('')}</div>`
      : '';
    const textHtml = msg.content
      ? `<div class="msg-text">${escHtml(msg.content)}</div>`
      : '';
    el.innerHTML = `<div class="avatar">U</div><div class="message-body">${imagesHtml}${textHtml}</div>`;
    messagesEl.appendChild(el);
    scrollBottom();
  }

  function appendThinking() {
    document.getElementById('welcome')?.remove();
    const el = document.createElement('div');
    el.className = 'message assistant';
    el.innerHTML = `
      <div class="avatar">⚡</div>
      <div class="message-body">
        <div class="thinking"><span></span><span></span><span></span></div>
      </div>`;
    messagesEl.appendChild(el);
    scrollBottom();
    return el;
  }

  function renderMd(text) { return marked.parse(text); }

  function addCopyBtn(pre) {
    const btn = document.createElement('button');
    btn.className = 'copy-code-btn';
    btn.textContent = 'Copy';
    btn.addEventListener('click', () => {
      const code = pre.querySelector('code')?.textContent || pre.textContent;
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = '✓ Copied';
        setTimeout(() => btn.textContent = 'Copy', 2000);
      });
    });
    pre.appendChild(btn);
  }

  function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 180) + 'px';
  }

  function escHtml(str) {
    return str
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── Chat management ───────────────────────────────────
  function startNewChat() {
    if (isStreaming) return;
    messages = [];
    currentConvId = null;
    messagesEl.innerHTML = '';
    showWelcome();
    inputEl.focus();
  }

  function showWelcome() {
    const el = document.createElement('div');
    el.id = 'welcome';
    el.innerHTML = `
      <div class="welcome-glyph">⚡</div>
      <h2>OfflineAI</h2>
      <p>Chat privately with <strong>${escHtml(DEFAULT_MODEL)}</strong> running locally.<br>No data ever leaves your device.</p>`;
    messagesEl.appendChild(el);
  }

  window.setPrompt = function(text) {
    inputEl.value = text;
    autoResize(inputEl);
    inputEl.focus();
  };

  init();
</script>
</body>
</html>
